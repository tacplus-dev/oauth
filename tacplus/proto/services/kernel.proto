// ============================================================================
// Token Exchanger
// ============================================================================

// TokenExchangerState holds the public verifying keys for the built-in token
// exchange service. TokenExchanger is built into kernel to solve the
// chicken-egg problem: services like Identity need a ServiceToken from
// TokenExchanger (via their CredPair) before they can register their own
// JWKs with kernel. If TokenExchanger were external, it would need a
// ServiceToken from itself to bootstrap.
//
// TokenExchanger does three things:
//   1. Accepts tokens signed by a CredPair → returns refresh tokens
//   2. Accepts refresh tokens → returns access tokens
//   3. Accepts unexpired refresh tokens + CredPair tokens → returns new
//      refresh tokens with the client_id carrying over
//
// All tokens issued by TokenExchanger are exclusively for communicating
// with the kernel backend. Kernel validates them internally via the
// SecurityInterceptor.
// Access: RW for kernel, RO for any service that needs to verify exchanger tokens.
message TokenExchangerState {

  // Verification keys — the exchanger's public keys, rotated periodically.
  // The exchanger holds the corresponding private keys internally.
  // Used by kernel's SecurityInterceptor to validate tokens for backend calls.
  repeated jwk.Jwk verifying_keys = 1;
}

// TrustedCaState stores trusted CA certificates for TLS verification.
// Installed from Config.trusted_cas on each config load.
// Services read these (RO) to verify TLS connections.
message TrustedCaState {

  repeated x509.X509Cert trusted_cas = 1;
}

// TokenExchangerService is the built-in backend RPC service for token exchange.
// Accepts a CredPair-signed token or refresh token and returns tokens for
// backend (kernel) communication. Hand-written implementation; tacplus
// generates client wrappers and server wiring.
service TokenExchangerService {

  // ExchangeToken validates the input token, evaluates OPA policy,
  // and returns a signed access token.
  rpc ExchangeToken(tokenrequest.TokenRequest) returns (token.Token);
}

