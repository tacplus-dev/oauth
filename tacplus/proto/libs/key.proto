// This file defines cryptographic key types and key pair structures used for
// authentication, encryption, and signing throughout the system.
// Changes to these definitions will break cryptographic operations in all
// services that handle keys, certificates, and secure communications.
// ============================================================================

syntax = "proto3";

package key;
option go_package = "gitlab.com/secondstarcavalier/controlplane/services/sentinel/tacplus/types/libs/key";

// KeyType represents the key type. Valid values are RSA, EC (Elliptic Curve),
// and OKP (Octet Key Pair for EdDSA).
enum KeyType {
  // KtyTypeUndefined represents an unspecified key type
  KEY_TYPE_UNDEFINED = 0;
  // KeyTypeRsa represents an RSA key type
  KEY_TYPE_RSA = 1;
  // KeyTypeEc represents an Elliptic Curve key type
  KEY_TYPE_EC = 2;
  // KeyTypeOkp represents an Octet Key Pair (EdDSA) key type
  KEY_TYPE_OKP = 3;
}

// PublicKey represents a public cryptographic key.
// The key is stored as a base64-encoded PEM block in PKIX format.
// Use NewProtoPublicKey() in Go or similar constructors in other languages to create.
message PublicKey {
  // Id is a unique identifier for the key (corresponds to kid in JWK)
  string id = 1;
  // Base64 contains the base64url-encoded PEM public key block
  string base64 = 2;
  // Created is the Unix epoch timestamp (seconds) when the key was created
  // Valid range: 1735689600 (2025-01-01) to 8045740800 (2225-01-01)
  int64 created = 3;
}

// Key represents a private cryptographic key (alias for ProtoKey).
message Key {
  // Id is a unique identifier for the key (corresponds to kid in JWK)
  string id = 1;
  // Base64 contains the base64url-encoded PEM private key block
  string base64 = 2;
  // Created is the Unix epoch timestamp (seconds) when the key was created
  // Valid range: 1735689600 (2025-01-01) to 8045740800 (2225-01-01)
  int64 created = 3;
}

// UseType represents the intended use of a key.
// Valid values are "sig" (signature) and "enc" (encryption).
enum UseType {
  // UseTypeUndefined represents an unspecified use type
  USE_TYPE_UNDEFINED = 0;
  // UseTypeSig represents signature use
  USE_TYPE_SIG = 1;
  // UseTypeEnc represents encryption use
  USE_TYPE_ENC = 2;
}
