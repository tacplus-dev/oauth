syntax = "proto3";

package httpserver;
option go_package = "gitlab.com/secondstarcavalier/controlplane/services/fleetwood/tacplus/types/libs/httpserver";

import "libs/x509.proto";

// ServerMode represents the TLS configuration mode for the web server.
// It determines how the server handles HTTPS and certificate management.
enum ServerMode {
  // SERVER_MODE_UNDEFINED is undefined
  SERVER_MODE_UNDEFINED = 0;

  // SERVER_MODE_LETS_ENCRYPT uses Let's Encrypt to obtain certificate.
  // HTTP is enabled for Let's Encrypt challenge only.
  SERVER_MODE_LETS_ENCRYPT = 1;

  // SERVER_MODE_CERT uses certificate specified in config. HTTP is disabled.
  SERVER_MODE_CERT = 2;

  // SERVER_MODE_NO_TLS runs service on HTTP only. HTTPS is disabled.
  SERVER_MODE_NO_TLS = 3;
}

// Config represents the configuration for the web server.
// It controls HTTP/HTTPS listeners, TLS settings, and domain configuration.
message Config {
  // HttpListen is the address to listen on for HTTP.
  // Example: ":8080", "127.0.0.1:8080"
  string http_listen = 1;

  // HttpsListen is the address to listen on for HTTPS.
  // Example: ":8443", "0.0.0.0:443"
  string https_listen = 2;

  // TlsCert is the TLS certificate to use when ServerMode is SERVER_MODE_CERT.
  // This field is required when ServerMode is SERVER_MODE_CERT and ignored otherwise.
  x509.X509CertPair tls_cert = 3;

  // ServerMode determines the TLS configuration mode.
  // - SERVER_MODE_LETS_ENCRYPT: Automatically obtain and renew certificates via Let's Encrypt
  // - SERVER_MODE_CERT: Use the certificate provided in TlsCert field
  // - SERVER_MODE_NO_TLS: Run HTTP only, HTTPS disabled
  ServerMode server_mode = 4;

  // FQDN is the fully qualified domain name.
  // Required when ServerMode is SERVER_MODE_LETS_ENCRYPT for certificate generation.
  // Example: "example.com", "api.example.com"
  string fqdn = 5;

  // LetsEncryptEmail is the email address to use for Let's Encrypt account registration.
  // This email is used by Let's Encrypt for certificate expiration notifications and
  // important account updates. If not specified, a default email will be used.
  // Only used when ServerMode is SERVER_MODE_LETS_ENCRYPT.
  // Example: "admin@example.com", "ssl-admin@company.com"
  string lets_encrypt_email = 6;

  // StaticFilePaths defines file-based path registrations for serving static content.
  // Each entry maps a URL path to a local directory.
  // Requests to the URL path will serve files from the corresponding directory.
  repeated StaticFilePath static_file_paths = 8;
}

// State is the state of the server. This is automatically generated and shared with other instances.
// It contains runtime information about the server's certificate state.
message State {
  // LastUpdated is the last time the state was updated (Unix timestamp in seconds).
  int64 last_updated = 1;

  // Cert is the state of the TLS certificate.
  CertState cert = 2;
}

// CertState is the state of the Let's Encrypt certificates. This is automatically generated,
// shared with other services, and persisted to disk. CertState is a recursive tree structure
// that mirrors the file system structure of Let's Encrypt certificate data.
message CertState {
  // IsDir indicates whether this entry represents a directory
  bool is_dir = 1;

  // ModTime is the modification time of the certificate file or directory (Unix timestamp).
  int64 mod_time = 2;

  // Value contains the raw certificate data (empty for directories).
  bytes value = 3;

  // Certs contains child certificate entries for directory structures.
  // The map key is the filename or subdirectory name.
  map<string, CertState> certs = 4;
}

// StaticFilePath represents a mapping between a URL path and a local directory
// for serving static files. The webserver will serve files from the directory
// when requests are made to the URL path.
message StaticFilePath {
  // UrlPath is the URL path prefix where static files will be served.
  // Example: "/static", "/assets", "/public"
  // Requests to this path will serve files from the Directory.
  string url_path = 1;

  // Directory is the local filesystem directory containing static files to serve.
  // Can be an absolute path or relative to the server's working directory.
  // Example: "./public", "/var/www/static", "./assets"
  string directory = 2;
}

// HealthCheckResponse represents the response from the health check endpoint.
// This endpoint is automatically registered at PATH_HEALTH_CHECK ("/health") and
// is used by container orchestrators, load balancers, and monitoring systems to
// verify service availability.
//
// The health check endpoint:
// - Always responds on HTTP (for unauthenticated health checks)
// - Also responds on HTTPS if TLS is enabled
// - Returns HTTP 200 status code when healthy
// - Requires no authentication
//
// Example response:
//   {
//     "status": "ok",
//     "time": 1769799000
//   }
message HealthCheckResponse {
  // Status indicates the health of the service.
  // Value is "ok" when the service is healthy and ready to accept requests.
  string status = 1;

  // Time is the Unix timestamp (seconds since epoch) when the health check was performed.
  // This can be used to detect stale responses or clock skew issues.
  int64 time = 2;
}

// PATH_HEALTH_CHECK is the URL path for the health check endpoint.
// The health check endpoint is automatically registered on all servers and
// always responds on HTTP (for container orchestration health checks).
// If HTTPS is enabled, the endpoint also responds on HTTPS.
// Example: http://localhost:8080/health