syntax = "proto3";

package http;
option go_package = "gitlab.com/secondstarcavalier/controlplane/services/sentinel/tacplus/types/libs/http";

// Method represents HTTP request methods using bitmask values.
// Values are powers of 2 to enable bitwise OR operations for combining methods.
// Use METHOD_ANY to represent all standard HTTP methods.
enum Method {
  // METHOD_UNSPECIFIED represents an unspecified HTTP method
  METHOD_UNSPECIFIED = 0;
  // METHOD_GET represents the HTTP GET method for retrieving resources
  METHOD_GET     = 1;    // 1 << 0
  // METHOD_HEAD represents the HTTP HEAD method for retrieving headers only
  METHOD_HEAD    = 2;    // 1 << 1
  // METHOD_POST represents the HTTP POST method for creating resources
  METHOD_POST    = 4;    // 1 << 2
  // METHOD_PUT represents the HTTP PUT method for updating resources
  METHOD_PUT     = 8;    // 1 << 3
  // METHOD_DELETE represents the HTTP DELETE method for deleting resources
  METHOD_DELETE  = 16;   // 1 << 4
  // METHOD_PATCH represents the HTTP PATCH method for partial updates
  METHOD_PATCH   = 32;   // 1 << 5
  // METHOD_OPTIONS represents the HTTP OPTIONS method for discovering supported methods
  METHOD_OPTIONS = 64;   // 1 << 6
  // METHOD_TRACE represents the HTTP TRACE method for debugging
  METHOD_TRACE   = 128;  // 1 << 7
  // METHOD_CONNECT represents the HTTP CONNECT method for tunneling
  METHOD_CONNECT = 256;  // 1 << 8
  // METHOD_GRPC represents gRPC method calls
  METHOD_GRPC    = 512;    // 1 << 9
  // METHOD_ANY represents all standard HTTP methods (bitwise OR of all methods)
  METHOD_ANY = 1023; // 1+2+4+8+16+32+64+128+256+512
}
