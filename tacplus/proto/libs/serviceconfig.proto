syntax = "proto3";

package serviceconfig;
option go_package = "gitlab.com/secondstarcavalier/controlplane/services/sentinel/tacplus/types/libs/serviceconfig";

import "libs/host.proto";
import "libs/jwk.proto";
import "libs/key.proto";
import "libs/logger.proto";
import "libs/x509.proto";
import "google/protobuf/empty.proto";

// Environment variable name for bootstrap config file path.

// JWT issuer for all backend service tokens. All services share this constant issuer.

// ============================================================================
// Bootstrap Configuration (static, loaded from YAML at boot)
// ============================================================================

// BootstrapConfig holds the minimum configuration needed to connect to the backend.
// Loaded from YAML at boot, immutable for the lifetime of the process.
// All runtime-tunable settings (listen address, TLS, logging, timeouts)
// are in Config, delivered via ServiceConfigState from the backend.
message BootstrapConfig {

  // The backend service endpoints (cluster).
  // Each entry is a host:port pair (e.g. host=10.0.0.1, port=9443).
  repeated host.Host endpoints = 1;

  // instance_id uniquely identifies this running instance/replica.
  // Used for leader elections on boundaries with (spec.leader) = true.
  // If empty, a random ID is generated at client creation time.
  string instance_id = 2;

  // private_key is used to mint throwaway bootstrap JWTs for the
  // CredPair token exchange flow. The kid is in private_key.id;
  // identity (subject/audience) comes from the CredPair looked up
  // by TokenExchanger using the matching kid.
  // If absent, cloud-native authentication is attempted.
  key.Key private_key = 3;

  // trusted_cas is the list of CA certificates trusted for TLS verification
  // when connecting to backend endpoints. If empty, system root CAs are used.
  repeated x509.X509Cert trusted_cas = 6;
}

// ============================================================================
// Runtime Configuration (delivered via the backend, subscribed at runtime)
// ============================================================================

// Config holds runtime configuration delivered by the backend to all services via
// the ServiceConfigState boundary. This config can change at any time;
// services subscribe to updates and apply them dynamically.
message Config {

  // ============================================================================
  // Backend Client — Connection Tuning
  // ============================================================================

  // ping_interval_ms controls how often each endpoint is pinged for latency measurement.
  // Default: 5000 (5 seconds)
  int32 ping_interval_ms = 4;

  // rebalance_interval_ms controls how often the active connection is re-evaluated
  // based on latency. Default: 10000 (10 seconds)
  int32 rebalance_interval_ms = 5;

  // ============================================================================
  // Frontend Server — Network & TLS
  // ============================================================================

  // listen_address is the bind address for the gRPC server (e.g. host=0.0.0.0, port=8080).
  host.Host listen_address = 7;

  // tls_cert is the TLS certificate and private key pair for the frontend server.
  x509.X509CertPair tls_cert = 8;

  // ============================================================================
  // Frontend Server — Request Limits
  // ============================================================================

  // max_request_size is the maximum request size in bytes.
  // Must be greater than 0. Default: 10MB (10485760 bytes)
  int64 max_request_size = 9;

  // request_timeout_seconds is the timeout for client requests.
  // Must be positive. Default: 30 seconds.
  int64 request_timeout_seconds = 10;

  // ============================================================================
  // Observability
  // ============================================================================

  // logger configures the logger for the service.
  // Controls log format (JSON/console), level, output paths, and more.
  logger.LoggerConfig logger = 11;

  // shutdown_timeout_seconds is the maximum time (in seconds) to wait for graceful
  // shutdown after SIGTERM before forcing immediate shutdown.
  // Must be positive. Default: 30 seconds.
  int64 shutdown_timeout_seconds = 14;
}

// ============================================================================
// Backend Service — Cluster Messages
// ============================================================================

// LogMessage is a log entry sent from the backend to the service for logging.
message LogMessage {
  // level is the severity level for this log message.
  logger.Level level = 1;

  // message is the log message text.
  string message = 2;
}

// MemberStatus represents the lifecycle state of a cluster member.
enum MemberStatus {
  MEMBER_STATUS_UNKNOWN = 0;
  MEMBER_STATUS_STARTING = 1;
  MEMBER_STATUS_READY = 2;
  MEMBER_STATUS_DRAINING = 3;
  MEMBER_STATUS_SHUTTING_DOWN = 4;
  MEMBER_STATUS_UNREACHABLE = 5;
}

// ClusterMember describes a single member (pod/node) within a cluster.
message ClusterMember {
  // endpoint is the host:port address of this member.
  host.Host endpoint = 1;
  MemberStatus status = 2;
  int32 priority = 3;
}

// ClusterInfo describes a single Kubernetes cluster and its members.
message ClusterInfo {
  string org_id = 1;
  string region = 2;
  string zone = 3;
  string cluster_name = 4;
  repeated ClusterMember members = 5;
}

// ClusterState is a snapshot of the full multi-region, multi-cluster topology.
message ClusterState {
  repeated ClusterInfo clusters = 1;
}

// PingResponse is returned by Ping to confirm the member is reachable.
message PingResponse {
  MemberStatus status = 1;
}

// ============================================================================
// Services
// ============================================================================

// BackendService provides service-to-service communication between
// backend cluster members and clients (services).
service BackendService {
  // Log opens a server-streaming channel for the backend to push log messages.
  rpc Log(google.protobuf.Empty) returns (stream LogMessage);

  // Ping verifies that a member is reachable and returns its identity.
  rpc Ping(google.protobuf.Empty) returns (PingResponse);

  // Subscribe streams cluster state updates across all clusters and regions.
  rpc Subscribe(google.protobuf.Empty) returns (stream ClusterState);

  // WatchJwks streams the current JWKS (JSON Web Key Set) used for token verification.
  // The server sends an updated Jwks message whenever the key set changes.
  rpc WatchJwks(google.protobuf.Empty) returns (stream jwk.Jwks);
}

// ============================================================================
// ServiceConfigState — shared runtime config for all frontend services
// ============================================================================

// ServiceConfigState delivers runtime configuration (OPA policy, TLS, logging)
// to all frontend services. The backend writes the config; frontends subscribe
// via OnChange to receive updates.
message ServiceConfigState {

  Config config = 1;
}

// ============================================================================
// Auto-generated Backend Service (tacplus)
// ============================================================================

service ServiceConfigStateBackendService {
	// Singleton: Config
	rpc GetConfig(google.protobuf.Empty) returns (Config);
	rpc SetConfig(Config) returns (Config);
	rpc WatchConfig(google.protobuf.Empty) returns (stream Config);
}

message MapEmpty {}
