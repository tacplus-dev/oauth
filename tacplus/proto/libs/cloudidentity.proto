// Package cloudidentity defines the CloudIdentityProof message used to
// prove workload identity via cloud-native mechanisms. A workload running
// in a cloud environment (AWS, GCP, Azure) obtains a proof from its
// cloud's metadata service and presents it to TokenExchanger in place
// of a key-signed JWT. The server validates the proof against the
// cloud provider's public infrastructure and maps the resulting identity
// to a ServiceEntitlementMapping principal.

syntax = "proto3";

package cloudidentity;
option go_package = "gitlab.com/secondstarcavalier/controlplane/services/sentinel/tacplus/types/libs/cloudidentity";

import "libs/cloudvendor.proto";

// CloudIdentityProof carries a cloud-native identity assertion.
// Exactly one of presigned_request or identity_token must be set,
// determined by the cloud vendor.
message CloudIdentityProof {
  // vendor identifies the cloud provider that issued this proof.
  cloudvendor.CloudVendor vendor = 1;

  // presigned_request is used for AWS: a signed STS GetCallerIdentity
  // request that the server executes to verify the caller's IAM identity.
  // The request has a short TTL to prevent replay.
  PresignedHttpRequest presigned_request = 2;

  // identity_token is used for GCP and Azure: a signed JWT or OAuth2
  // token obtained from the cloud metadata service. The server validates
  // it against the provider's public JWKS/OIDC endpoint.
  string identity_token = 3;
}

// PresignedHttpRequest carries a pre-signed HTTP request that the server
// executes on behalf of the caller. For AWS, this is a SigV4-signed
// STS GetCallerIdentity request.
message PresignedHttpRequest {
  // method is the HTTP method (e.g. "POST").
  string method = 1;

  // url is the full request URL including query parameters.
  string url = 2;

  // headers are the signed HTTP headers that must be forwarded verbatim.
  // Keys are header names, values are header values.
  map<string, string> headers = 3;

  // body is the request body (e.g. "Action=GetCallerIdentity&Version=2011-06-15").
  string body = 4;
}
