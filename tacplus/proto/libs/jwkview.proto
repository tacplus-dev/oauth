// ============================================================================
// This file defines the cross-boundary JWK verifying keys view service.
// frontendserver subscribes to this service for token signature verification.
// the backend automatically implements this service by aggregating all
// collections annotated with (spec.view_member) = "JwkVerifyingKeysView".
// ============================================================================

syntax = "proto3";

package jwkview;
option go_package = "gitlab.com/secondstarcavalier/controlplane/services/sentinel/tacplus/types/libs/jwkview";

import "libs/jwk.proto";
import "google/protobuf/empty.proto";

// JwkVerifyingKeysViewService provides a read-only aggregated view of all
// JWK verifying keys across all service backends that registered via
// (spec.view_member) = "JwkVerifyingKeysView".
//
// This service is automatically implemented by the backend.
// frontendserver subscribes to it for token signature verification.
service JwkVerifyingKeysViewService {
  rpc Watch(google.protobuf.Empty) returns (stream JwkViewResponse);
  rpc Get(JwkViewGetRequest) returns (JwkViewGetResponse);
}

message JwkViewResponse {
  map<string, jwk.Jwk> entries = 1;  // kid -> Jwk
}

message JwkViewGetRequest {
  string kid = 1;
}

message JwkViewGetResponse {
  jwk.Jwk value = 1;
  bool found = 2;
}
