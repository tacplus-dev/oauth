// Package outputformat defines serialization format identifiers used by CLI
// tools and API responses. Services that support multiple output formats
// (JSON, YAML, protobuf wire, etc.) reference these values to negotiate
// the response encoding.

syntax = "proto3";

package outputformat;
option go_package = "gitlab.com/secondstarcavalier/controlplane/services/sentinel/tacplus/types/libs/outputformat";

// OutputFormat represents the output format for data serialization
enum OutputFormat {
  // Undefined or unknown output format
  OUTPUT_FORMAT_UNDEFINED = 0;

  // JSON format
  OUTPUT_FORMAT_JSON = 1;

  // YAML format
  OUTPUT_FORMAT_YAML = 2;

  // Multi YAML format (e.g. ---)
  OUTPUT_FORMAT_MULTI_YAML = 3;

  // Plain text format
  OUTPUT_FORMAT_TEXT = 4;

  // Environment variable format
  OUTPUT_FORMAT_ENV_VAR = 5;

  // Protobuf wire format (binary)
  OUTPUT_FORMAT_PROTO_WIRE = 6;

  // TOML format
  OUTPUT_FORMAT_TOML = 7;
}
