// Package ip defines compact binary protobuf representations for IPv4 and IPv6
// addresses, networks, and endpoints. Adapted from github.com/jodydadescott/ipaddr4j.
//
// Wire-efficient storage:
//   IPv4 address = fixed32 (4 bytes)
//   IPv6 address = 2x fixed64 (16 bytes)
//   CIDR mask    = uint32 varint (1 byte)
//   Port         = uint32 varint (1-3 bytes)
//
// Generated helpers in each language provide parsing (from string), formatting
// (to string), masking, contains, overlaps, broadcast, network address, and
// subnet enumeration — mirroring the ipaddr4j API for both IPv4 and IPv6.

syntax = "proto3";
package ip;
option go_package = "gitlab.com/secondstarcavalier/controlplane/services/sentinel/tacplus/types/libs/ip";

// IPv4 stores an IPv4 address as a single fixed32 (4 bytes on the wire).
// Stored in network byte order (big-endian).
// Example: 192.168.1.100 → {addr: 0xC0A80164}
message IPv4 {
  fixed32 addr = 1;
}

// IPv6 stores an IPv6 address as two 64-bit halves for minimal wire size.
// Example: 2001:0db8::1 → {high: 0x20010db800000000, low: 0x0000000000000001}
message IPv6 {
  fixed64 high = 1;
  fixed64 low = 2;
}

// IPAddr stores either an IPv4 or IPv6 address.
message IPAddr {
  oneof address {
    IPv4 ipv4 = 1;
    IPv6 ipv6 = 2;
  }
}

// IPNet stores an IPv4 or IPv6 network (address + CIDR prefix length).
// Provides network operations: contains, overlaps, broadcast, subnets.
message IPNet {
  oneof address {
    IPv4 ipv4 = 1;
    IPv6 ipv6 = 2;
  }
  // CIDR prefix length (0-32 for IPv4, 0-128 for IPv6).
  uint32 mask = 3;
}

// IPPort stores an IP address with a TCP/UDP port number.
message IPPort {
  oneof address {
    IPv4 ipv4 = 1;
    IPv6 ipv6 = 2;
  }
  // TCP/UDP port number (0-65535).
  uint32 port = 3;
}

// IPNets holds a collection of networks with support for CIDR aggregation.
// Generated helpers provide Aggregate() to merge adjacent/overlapping
// networks into a minimal set, and Match() to check if an address falls
// within any network in the collection.
message IPNets {
  repeated IPNet nets = 1;
}
