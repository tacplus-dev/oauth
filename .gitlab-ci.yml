stages:
  - build
  - package

variables:
  GOPRIVATE: "gitlab.com/secondstarcavalier/*"
  GONOSUMCHECK: "gitlab.com/secondstarcavalier/*"
  CGO_ENABLED: "0"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

build:
  stage: build
  image: golang:1.25-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache git
    - *setup-netrc
  script:
    - go build -trimpath -ldflags="-s -w" -o bin/sentinel .
  artifacts:
    paths:
      - bin/sentinel
    expire_in: 1 hour

package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > /tmp/.netrc
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/sentinel-${MAJOR}-${MINOR}"
      docker build --secret id=netrc,src=/tmp/.netrc -t "${IMAGE}:${PATCH}" .
      docker tag "${IMAGE}:${PATCH}" "${IMAGE}:latest"
      docker push "${IMAGE}:${PATCH}"
      docker push "${IMAGE}:latest"
