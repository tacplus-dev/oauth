stages:
  - build
  - package
  - manifest

compute-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - V="${CI_COMMIT_TAG#v}"
    - MAJOR="$(echo "$V" | cut -d. -f1)"
    - MINOR="$(echo "$V" | cut -d. -f2)"
    - echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

.build-arch:
  stage: build
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *setup-netrc
    - tacplus build --no-container --skip-post
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/oauth
    expire_in: 1 hour

build-amd64:
  extends: .build-arch

build-arm64:
  extends: .build-arch
  tags:
    - saas-linux-large-arm64

.package-arch:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/oauth-${MAJOR}-${MINOR}"
      docker build \
        -t "${IMAGE}:${PATCH}-${ARCH}" \
        .
      docker push "${IMAGE}:${PATCH}-${ARCH}"

package-amd64:
  extends: .package-arch
  needs:
    - build-amd64
  variables:
    ARCH: amd64

package-arm64:
  extends: .package-arch
  needs:
    - build-arm64
  tags:
    - saas-linux-large-arm64
  variables:
    ARCH: arm64

manifest:
  stage: manifest
  image: docker:latest
  services:
    - docker:dind
  needs:
    - package-amd64
    - package-arm64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/oauth-${MAJOR}-${MINOR}"
      docker manifest create "${IMAGE}:${PATCH}" \
        "${IMAGE}:${PATCH}-amd64" \
        "${IMAGE}:${PATCH}-arm64"
      docker manifest push "${IMAGE}:${PATCH}"
      docker manifest create "${IMAGE}:latest" \
        "${IMAGE}:${PATCH}-amd64" \
        "${IMAGE}:${PATCH}-arm64"
      docker manifest push "${IMAGE}:latest"
