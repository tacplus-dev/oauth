stages:
  - build
  - package
  - manifest

compute-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  script:
    - V="${CI_COMMIT_TAG#v}"
    - DOTPART="${V%%-*}"
    - MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
    - MINOR="$(echo "$DOTPART" | cut -d. -f2)"
    - echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    DOTPART="${V%%-*}"
    MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
    MINOR="$(echo "$DOTPART" | cut -d. -f2)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

.build-arch:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  cache:
    - key: tacplus
      paths:
        - tacplus/
    - key: cargo-$ARCH
      paths:
        - .cargo-home/registry
        - .cargo-home/git
  before_script:
    - *setup-netrc
    - tacplus build --skip-post
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/oauth
    expire_in: 1 day

build-arm64:
  extends: .build-arch
  tags:
    - br.aarch64
  variables:
    ARCH: arm64

.package-arch:
  stage: package
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    # Merge group credentials (DOCKER_AUTH_CONFIG, cross-project read) with the CI
    # job token (push access) into ~/.docker/config.json so docker build can pull
    # schematic base images and docker push can write to the project registry.
    - mkdir -p ~/.docker
    - '[ -n "$DOCKER_AUTH_CONFIG" ] && echo "$DOCKER_AUTH_CONFIG" > ~/.docker/config.json || true'
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY_IMAGE"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/oauth-${MAJOR}-${MINOR}"
      docker build \
        --platform linux/${ARCH} \
        -t "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}" \
        .
      docker push "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}"

package-arm64:
  extends: .package-arch
  tags:
    - br.aarch64
  needs:
    - build-arm64
  variables:
    ARCH: arm64

manifest:
  stage: manifest
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  tags:
    - br.aarch64
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - package-arm64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    # Merge group credentials (DOCKER_AUTH_CONFIG, cross-project read) with the CI
    # job token (push access) into ~/.docker/config.json so docker build can pull
    # schematic base images and docker push can write to the project registry.
    - mkdir -p ~/.docker
    - '[ -n "$DOCKER_AUTH_CONFIG" ] && echo "$DOCKER_AUTH_CONFIG" > ~/.docker/config.json || true'
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY_IMAGE"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/oauth-${MAJOR}-${MINOR}"
      docker pull --platform linux/arm64 "${IMAGE}:${CI_COMMIT_TAG}-arm64"
      docker tag "${IMAGE}:${CI_COMMIT_TAG}-arm64" "${IMAGE}:${CI_COMMIT_TAG}"
      docker push "${IMAGE}:${CI_COMMIT_TAG}"
# ---------------------------------------------------------------------------
# Proto validation: fires when proto CI fans out on new proto tag.
# ---------------------------------------------------------------------------
compute-validate-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $PROTO_VALIDATE == "true"
  script:
    - V="${PROTO_VERSION#v}"
    - DOTPART="${V%%-*}"
    - MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
    - MINOR="$(echo "$DOTPART" | cut -d. -f2)"
    - echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

proto-validate:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-validate-image]
  rules:
    - if: $PROTO_VALIDATE == "true"
  before_script:
    - *setup-netrc
  script:
    - tacplus build --skip-post --tag $PROTO_VERSION
