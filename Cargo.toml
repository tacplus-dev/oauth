[package]
name = "oauth"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
dashmap = "6"
futures = "0.3"
prost = "0.14"
prost-types = "0.14"
prost-wkt-types = "0.7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
oauth-model = { path = "target/generated-sources/model" }
servicemanager = { path = "target/generated-sources/model/libs/servicemanager" }
token = { path = "target/generated-sources/model/libs/token" }
