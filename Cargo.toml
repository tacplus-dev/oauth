[package]
name = "oauth"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
dashmap = "6"
futures = "0.3"
# MX lookups for Auth.ClassifySignInEmail (signin_email.rs).
hickory-resolver = "0.26"
prost = "0.14"
prost-types = "0.14"
prost-wkt-types = "0.7"
rand = "0.8"
# rustls-tls-webpki-roots compiles the Mozilla root store INTO the binary and is
# not optional: the runtime image (see Dockerfile) ships no /etc/ssl/certs, so
# rustls-tls-native-roots finds nothing there and IDP certificate verification
# would have no trust anchors at all. It was reaching oauth only by feature
# unification with the chassis httpclient crate; named here so oauth's own TLS
# trust does not depend on another crate keeping that feature on.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
oauth-model = { path = "target/generated-sources/model" }
logger = { path = "target/generated-sources/model/chassis/logger" }
servicemanager = { path = "target/generated-sources/model/chassis/servicemanager" }
jwk = { path = "target/generated-sources/model/chassis/jwk" }
token = { path = "target/generated-sources/model/chassis/token" }
# Signs the Sign in with Apple client-secret JWT with the .p8 key (apple.rs).
key = { path = "target/generated-sources/model/chassis/key" }

[dev-dependencies]
# Server side of the TLS stack, used by the oidc TLS verification tests to stand
# up a real HTTPS listener the OIDC client dials for real.
# default-features off pins these to the ring provider the crate already links.
# The defaults would additionally pull in aws-lc-rs, which needs cmake and a C
# toolchain at build time and would give rustls two providers to choose between.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
