language: rust
pkg: com.gitlab.secondstarcavalier.controlplane.services.fleetwood
output-dir: target/generated-sources
grpc-servers:
  - services/fleetwood.FleetwoodSessionService
  - services/fleetwood.FleetwoodTokenService
grpc-clients:
  - services/kernel.KernelMintService
post-gen:
  - cmd: cargo
    args: [build, --release]
container:
  image: registry.gitlab.com/secondstarcavalier/controlplane/services/fleetwood/fleetwood
