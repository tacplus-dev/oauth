language: rust
# Compiler floor: the looper runs this MAJOR.MINOR line's latest patch.
tacplus: "2.5"
# Rust takes only pkg's last segment: the crate stays oauth-model.
pkg: com.github.tacplusdev.oauth
output-dir: target/generated-sources
src: proto
# oauth.proto declares clients of kernel.Mint and the sys minter hosted by kernel.
depends:
  - kernel
